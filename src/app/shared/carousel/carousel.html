<div class="carousel-wrapper">
  <div class="carousel-container">

    <!-- Botón de Navegación Izquierdo -->
    <button class="nav-btn btn-float-left" (click)="prev()" aria-label="Anterior">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>

    <!-- Peek izquierdo (Imagen previa) -->
    <div
      class="slide slide-peek slide-peek-left"
      [style.background-image]="'url(' + peekLeft().imageUrl + ')'"
      (click)="prev()"
    ></div>

    <!-- Slide principal -->
    <div
      class="slide slide-main"
      [style.background-image]="'url(' + currentItem().imageUrl + ')'"
      [class.anim-next]="animDir() === 'next'"
      [class.anim-prev]="animDir() === 'prev'"
      (mouseenter)="hovered.set(true)"
      (mouseleave)="hovered.set(false)"
    >
      <!-- Gradiente base para legibilidad -->
      <div class="overlay-base"></div>

      <!-- Footer (Visible por defecto) -->
      <div class="slide-footer" [class.hidden]="hovered()">
        @if (currentItem().tag) {
          <span class="footer-tag">{{ currentItem().tag }}</span>
        }
        <span class="footer-title">{{ currentItem().title }}</span>
      </div>

      <!-- Overlay de información (Visible en Hover) -->
      <div class="overlay-hover" [class.visible]="hovered()">
        <div class="overlay-content">
          @if (currentItem().tag) {
            <span class="tag">{{ currentItem().tag }}</span>
          }
          <h2 class="title">{{ currentItem().title }}</h2>
          @if (currentItem().subtitle) {
            <p class="subtitle">{{ currentItem().subtitle }}</p>
          }
          <div class="cta">
            <span>Ver más</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Peek derecho (Imagen siguiente) -->
    <div
      class="slide slide-peek slide-peek-right"
      [style.background-image]="'url(' + peekRight().imageUrl + ')'"
      (click)="next()"
    ></div>

    <!-- Botón de Navegación Derecho -->
    <button class="nav-btn btn-float-right" (click)="next()" aria-label="Siguiente">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </button>

  </div>

  <!-- Indicadores inferiores (Dots) -->
  <div class="carousel-controls">
    <div class="dots" role="tablist">
      @for (item of items; track $index) {
        <button
          class="dot"
          [class.dot-active]="$index === currentIndex()"
          (click)="goTo($index)"
          [attr.aria-label]="'Ir a slide ' + ($index + 1)"
          role="tab"
        ></button>
      }
    </div>
  </div>
</div>
